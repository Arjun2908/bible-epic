name: generate
on:
  workflow_dispatch:
    inputs:
      episode: {description: "episode folder name under episodes/", required: true}
      mode: {description: "probe, stills or clips", required: true, default: stills, type: choice, options: [probe, stills, clips]}
      only: {description: "comma-separated art ids (optional)", required: false, default: ""}
      takes: {description: "takes per still (0 = episode default)", required: false, default: "0"}
permissions:
  contents: write
concurrency:
  group: generate-${{ inputs.episode }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      EP: ${{ inputs.episode }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - name: Build BSB text and run the accuracy gate
        run: |
          python pipeline/bsb.py build
          python pipeline/gate.py "episodes/$EP/episode.json"
      - name: Restore media generated by earlier runs
        run: |
          mkdir -p "out/$EP"
          if gh release download "$EP" --pattern 'media.zip' --dir /tmp/prev 2>/dev/null; then unzip -q -o /tmp/prev/media.zip -d "out/$EP"; fi
      - name: Generate
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$XAI_API_KEY" ]; then echo "::error::XAI_API_KEY secret is not set"; exit 1; fi
          python pipeline/generate.py "episodes/$EP/episode.json" --mode "${{ inputs.mode }}" --only "${{ inputs.only }}" --takes "${{ inputs.takes }}"
      - name: Contact sheets
        if: always()
        run: python pipeline/sheets.py "episodes/$EP/episode.json"
      - name: Store full-size media as a release asset
        if: always()
        run: |
          (cd "out/$EP" && zip -q -r /tmp/media.zip .)
          gh release view "$EP" >/dev/null 2>&1 || gh release create "$EP" --title "$EP media" --notes "Generated art for $EP"
          gh release upload "$EP" /tmp/media.zip --clobber
      - name: Commit review sheets
        if: always()
        run: |
          git config user.name "bible-epic-bot"; git config user.email "bot@users.noreply.github.com"
          git add review/ && git commit -q -m "review sheets: $EP (${{ inputs.mode }})" || echo "nothing to commit"
          git pull -q --rebase && git push -q
