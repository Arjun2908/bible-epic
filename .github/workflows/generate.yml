name: generate
on:
  workflow_dispatch:
    inputs:
      episode: {description: "episode folder name under episodes/", required: true}
      mode: {description: "probe, stills or clips", required: true, default: stills, type: choice, options: [probe, stills, clips]}
      only: {description: "comma-separated art ids (optional)", required: false, default: ""}
      takes: {description: "takes per still (0 = episode default)", required: false, default: "0"}
      redo: {description: "true = delete and regenerate the ids listed in only", required: false, default: "false"}
permissions:
  contents: write
concurrency:
  group: generate-${{ inputs.episode }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      EP: ${{ inputs.episode }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - name: Build BSB text and run the accuracy gate
        run: |
          python pipeline/bsb.py build
          python pipeline/gate.py "episodes/$EP/episode.json"
      - name: Restore media generated by earlier runs
        run: |
          mkdir -p "out/$EP"
          if gh release download "$EP" --pattern '*.zip' --dir /tmp/prev 2>/dev/null; then for z in /tmp/prev/*.zip; do unzip -q -o "$z" -d "out/$EP"; done; fi
      - name: Generate
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$XAI_API_KEY" ]; then echo "::error::XAI_API_KEY secret is not set"; exit 1; fi
          python pipeline/generate.py "episodes/$EP/episode.json" --mode "${{ inputs.mode }}" --only "${{ inputs.only }}" --takes "${{ inputs.takes }}" --redo "${{ inputs.redo }}"
      - name: Contact sheets
        if: always()
        run: python pipeline/sheets.py "episodes/$EP/episode.json"
      - name: Store full-size media as a release asset
        if: always()
        run: |
          # A release asset may not exceed 2 GB and a unit's clips alone approach that, so stills go in media.zip
          # and clips in clips-00.zip, clips-01.zip ... (30 clips each, stored uncompressed).
          shopt -s nullglob
          cd "out/$EP"
          zip -q -r /tmp/media.zip . -x 'clips/*'
          find clips -name '*.mp4' 2>/dev/null | sort | split -l 30 -d -a 2 - /tmp/cliplist-
          for l in /tmp/cliplist-*; do [ -s "$l" ] || continue; zip -q -0 "/tmp/clips-${l##*-}.zip" -@ < "$l"; done   # no clips yet: an empty list made zip fail and nothing was uploaded
          gh release view "$EP" >/dev/null 2>&1 || gh release create "$EP" --title "$EP media" --notes "Generated art for $EP"
          gh release upload "$EP" /tmp/media.zip /tmp/clips-*.zip --clobber
      - name: Commit review sheets
        if: always()
        run: |
          git config user.name "bible-epic-bot"; git config user.email "bot@users.noreply.github.com"
          rm -rf /tmp/review_new && cp -r "review/$EP" /tmp/review_new
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            rm -rf "review/$EP" && cp -r /tmp/review_new "review/$EP"
            git add "review/$EP" && (git commit -q -m "review sheets: $EP (${{ inputs.mode }})" || echo "nothing to commit")
            if git push -q origin HEAD:main; then echo "pushed"; exit 0; fi
            sleep $((RANDOM % 12 + 3))
          done
          echo "::error::could not push review sheets after 6 tries"; exit 1
